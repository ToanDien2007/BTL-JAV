<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Itoshira</title>
    <link rel="stylesheet" href="../css/components.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <link rel="stylesheet" href="../css/login.css" />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/forgot-password.css" />
  </head>
  <body>
    <div class="login-container">
      <div class="login-left">
        <div class="overlay">
          <a href="home.html" class="logo-link"><h1>Itoshira</h1></a>
          <p>Xin Chào Quý Khách!</p>
        </div>
      </div>

      <div class="login-right">
        <div class="login-box">
          <h2>Quên mật khẩu</h2>
          <p class="forgot-desc">
            Nhập email của bạn, chúng tôi sẽ gửi mã xác nhận.
          </p>

          <div class="input-group">
            <input type="email" placeholder="Nhập email của bạn" required />
          </div>

          <div class="input-group">
            <input type="text" placeholder="Nhập mã xác nhận" required />
          </div>

          <a href="#" class="resend-otp">Gửi mã xác nhận</a>

          <div class="input-group">
            <input type="password" placeholder="Mật khẩu mới" required />
          </div>

          <div class="input-group">
            <input
              type="password"
              placeholder="Xác nhận mật khẩu mới"
              required
            />
          </div>

          <button type="submit" class="btn-login">Xác nhận</button>

          <p class="register" style="margin-top: 20px">
            Nhớ mật khẩu rồi? <a href="login.html">Đăng nhập</a>
          </p>
        </div>
      </div>
    </div>
    <script src="../scripts/shared.js"></script>
    <script src="../scripts/toast.js"></script>
    <script src="../scripts/auth-ui.js"></script>
  </body>
</html>
